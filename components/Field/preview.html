<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.KenosUI, h = React.createElement, useState = React.useState;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'kui-col', style: { maxWidth: 480 } },
    h(B.Field, { label: 'Instance name', required: true, helperText: 'Lowercase letters, digits and hyphens.' }, h(B.Input, { placeholder: 'web01' })),
    h(B.Field, { label: 'Profile', orientation: 'horizontal' }, h(B.Select, { options: ['default', 'gpu', 'bridged'] }))));
</script>
</body>
</html>
