<!doctype html>
<html>
<head><meta charset="utf-8"><title>Stack — preview</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.KenosUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { padding: 16 } }, h(B.Stack, { direction: 'row', align: 'center' }, h(B.SegmentGroup, { size: 'sm', defaultValue: 'a', options: [{ value: 'a', label: 'All' }, { value: 'c', label: 'Container' }, { value: 'v', label: 'VMs' }] }), h(B.InputGroup, { startElement: 'search', style: { flex: '1 1 12rem', maxWidth: 320 } }, h(B.Input, { size: 'sm', placeholder: 'Filter …' })), h(B.Button, { size: 'sm', startIcon: 'plus' }, 'New'))));
</script>
</body>
</html>
