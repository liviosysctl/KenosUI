<!doctype html>
<html>
<head><meta charset="utf-8"><title>RelativeTime — preview</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
  var B = window.KenosUI, h = React.createElement, useState = React.useState;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'kui-row', style: { fontSize: 14, gap: 24 } },
    h('span', null, 'Started ', h(B.RelativeTime, { date: Date.now() - 4 * 60e3 })), h('span', null, 'Snapshot ', h(B.RelativeTime, { date: Date.now() - 26 * 3600e3 })), h('span', null, 'Backup ', h(B.RelativeTime, { date: Date.now() + 3 * 3600e3 }))));
</script>
</body>
</html>
